<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的书架 · My Bookshelf</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="site-title">📚 我的书架</h1>
      <p class="site-sub">赵公子的小书房 · 本地保存</p>
      <div class="search-wrap">
        <input id="searchBox" class="search-box" type="search" aria-label="搜索书名、作者或标签" placeholder="搜索书名 / 作者 / 标签" />
        <button id="clearSearch" class="clear-search hidden" type="button" aria-label="清空搜索">×</button>
      </div>
      <button id="addBookBtn" class="btn-add" title="添加一本新书">＋ 添加书籍</button>
      <button id="exportBtn" class="btn-tool" title="把书架备份成 .json 文件">⬇ 导出</button>
      <button id="importBtn" class="btn-tool" title="从 .json 文件恢复书架">⬆ 导入</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden />
    </div>
  </header>

  <!-- 顶部统计条（由 script.js 动态填充） -->
  <section class="stats-bar" id="statsBar"></section>
  <div class="shelf-toolbar">
    <p id="searchSummary" role="status">点击书籍编辑，拖到另一层可修改阅读状态。</p>
    <div id="undoBar" class="undo-bar hidden"><span id="undoMessage"></span><button id="undoBtn" class="btn-tool" type="button">撤销删除</button></div>
  </div>
  <p id="notice" class="notice hidden" role="status" aria-live="polite"></p>

  <main class="shelves" id="shelves">
    <!-- 三栏书架由 script.js 动态渲染 -->
  </main>

  <!-- 添加 / 编辑书籍弹窗 -->
  <dialog id="bookModal" class="modal" aria-labelledby="modalTitle">
      <button id="modalClose" class="modal-close" type="button" aria-label="关闭编辑窗口">×</button>
      <h2 id="modalTitle">添加书籍</h2>
      <form id="bookForm">
        <label>书名 <span class="req">*</span>
          <input id="fName" required placeholder="例如：聪明的投资者" />
        </label>
        <label>作者
          <input id="fAuthor" placeholder="例如：本杰明·格雷厄姆" />
        </label>
        <label>状态
          <select id="fStatus">
            <option value="reading">在读</option>
            <option value="finished">已读</option>
            <option value="want">想读</option>
          </select>
        </label>
        <div id="fProgressWrap" class="hidden">
          <label for="fProgress">已读进度（%）</label>
          <div class="progress-controls">
            <button id="progressMinus" class="btn-tool" type="button" aria-label="阅读进度减少 5%">−5%</button>
            <input id="fProgress" type="number" min="0" max="100" step="1" value="0" inputmode="numeric" />
            <button id="progressPlus" class="btn-tool" type="button" aria-label="阅读进度增加 5%">+5%</button>
          </div>
          <p class="field-hint">读完后，将状态改为「已读」。修改后点击保存。</p>
        </div>
        <label id="fRatingWrap" class="hidden">我的评分
          <select id="fRating">
            <option value="0" selected>暂未评分</option>
            <option value="1">★☆☆☆☆</option>
            <option value="2">★★☆☆☆</option>
            <option value="3">★★★☆☆</option>
            <option value="4">★★★★☆</option>
            <option value="5">★★★★★</option>
          </select>
        </label>
        <label>标签（逗号分隔）
          <input id="fTags" placeholder="例如：交易, 心理" />
        </label>
        <div class="modal-actions">
          <button id="fDelete" type="button" class="btn-del hidden">删除这本书</button>
          <button type="submit" class="btn-save">保存</button>
        </div>
      </form>
  </dialog>

  <dialog id="importModal" class="modal" aria-labelledby="importTitle" aria-describedby="importSummary">
    <button id="importClose" class="modal-close" type="button" aria-label="关闭导入窗口">×</button>
    <h2 id="importTitle">导入书架</h2>
    <p id="importSummary"></p>
    <label for="importMode">导入方式</label>
    <select id="importMode">
      <option value="merge">合并：保留现有书籍，跳过同名同作者的书</option>
      <option value="replace">替换：用导入的书籍替换当前书架</option>
    </select>
    <p class="field-hint">导入前会自动保留当前数据，可在页脚恢复。仅保留最近一次导入前的副本。</p>
    <div class="modal-actions">
      <button id="importCancel" class="btn-tool" type="button">取消</button>
      <button id="importConfirm" class="btn-save" type="button">确认导入</button>
    </div>
  </dialog>

  <footer class="footer">
    <p>书籍仅保存在当前浏览器，换设备不会自动同步。请定期导出备份。</p>
    <p id="backupStatus">尚未导出备份</p>
    <button id="restoreBtn" class="text-button hidden" type="button">恢复上次导入前的书架</button>
  </footer>

  <script src="script.js"></script>
</body>
</html>
